<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b1d12">
<meta name="description" content="DriveKit — plan a South India road trip before you turn the key: route legs, fuel and toll maths, stops, car checks, packing and a day-by-day plan.">
<title>DriveKit — The Road Trip, Planned Before You Turn the Key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf6ee; --paper2:#f3ecdd; --card:#fffdf7; --ink:#2b1d12; --ink2:#5c4632;
  --muted:#8a7360; --line:#e5d9c3; --bronze:#b7791f; --bronze2:#d9a441; --gold:#e8b84b;
  --terra:#c05b2e; --terra2:#a34a24; --sage:#7a7a52; --green:#4a7a3f; --red:#b3402e;
  --dark:#241812; --dark2:#3a2a1e; --shadow:0 10px 30px rgba(43,29,18,.10);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--terra)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze)}
.sec{padding:44px 0 8px}
.sec h2{font-size:clamp(26px,4vw,36px);font-weight:800;line-height:1.12;margin:6px 0 6px}
.sec .sub{color:var(--ink2);max-width:640px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip.gold{background:#f7e8c4;border-color:#e8cf96;color:#7a5510}
.chip.green{background:#e6efe0;border-color:#c4d8b8;color:#33511f}
.chip.red{background:#fbe4de;border-color:#f0c0b4;color:#8c2f1d}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14.5px;background:var(--ink);color:#fff;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(43,29,18,.25)}
.btn.terra{background:var(--terra)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 14px;font-size:13px}

.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.icon{width:18px;height:18px;flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:var(--dark);color:#f7ead2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s,visibility .6s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .road{width:min(420px,80vw);height:120px;position:relative;overflow:hidden;margin-bottom:8px}
#intro .road svg{width:100%;height:100%}
#intro .roadline{stroke-dasharray:14 12;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
#intro .car{animation:drive 2.6s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#intro h1{font-size:clamp(38px,8vw,64px);font-weight:800;letter-spacing:.01em}
#intro h1 span{color:var(--gold)}
#intro p{opacity:.85;max-width:420px;margin:10px auto 0;font-size:16px}
#intro .bar{width:min(300px,70vw);height:4px;background:rgba(255,255,255,.18);border-radius:99px;margin:26px auto 0;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .3s}
#introSkip{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.12);color:#f7ead2;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 20px;font-weight:700;font-size:13.5px}
#intro .stagger{opacity:0;transform:translateY(14px);animation:rise .7s ease forwards}
#intro .stagger:nth-child(2){animation-delay:.15s}#intro .stagger:nth-child(3){animation-delay:.3s}
#intro .stagger:nth-child(4){animation-delay:.45s}#intro .stagger:nth-child(5){animation-delay:.6s}
@keyframes rise{to{opacity:1;transform:none}}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:50;background:rgba(250,246,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:24px;font-weight:800}
.brand .mark{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--gold);display:grid;place-items:center}
.brand .mark svg{width:22px;height:22px}
.brand small{display:block;font-family:Inter,sans-serif;font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:700}
.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:99px}
.top nav a:hover{background:var(--paper2);color:var(--ink)}
/* ---------- hero ---------- */

.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;margin:0 auto;max-width:1240px}
.hero img{width:100%;height:460px;object-fit:cover;animation:kenburns 24s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08) translateY(-8px)}}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,24,18,.15) 0%,rgba(36,24,18,.05) 45%,rgba(36,24,18,.72) 100%)}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding:28px 24px 30px;color:#fff}
.hero .copy .eyebrow{color:var(--gold)}
.hero h1{font-size:clamp(30px,5.4vw,54px);font-weight:800;line-height:1.05;max-width:720px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero p{max-width:560px;opacity:.94;margin-top:10px;font-size:16.5px}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hero .stats .chip{background:rgba(255,253,247,.94);border-color:transparent;color:var(--ink)}
/* ---------- next trip card ---------- */
.nexttrip{margin-top:-34px;position:relative;z-index:5}
.nexttrip .card{padding:22px 24px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.nexttrip .when{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bigdays{font-family:Fraunces,serif;font-size:44px;font-weight:800;line-height:1;color:var(--terra)}
.bigdays small{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:800;margin-top:4px}
.nt-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.nt-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
/* ---------- trip tabs ---------- */
.triptabs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.triptabs::-webkit-scrollbar{display:none}
.triptab{flex:0 0 auto;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;min-width:210px}
.triptab b{display:block;font-family:Fraunces,serif;font-size:17px}
.triptab span{font-size:12.5px;color:var(--muted)}
.triptab.on{border-color:var(--bronze);background:#fbf3df;box-shadow:0 0 0 3px rgba(183,121,31,.15)}
/* ---------- route atlas ---------- */
.atlas{padding:6px 0 4px}
.atlas .roadline{position:relative;height:6px;background:repeating-linear-gradient(90deg,var(--bronze) 0 26px,transparent 26px 44px);border-radius:99px;margin:26px 8px 8px;opacity:.85}
.atlas .roadline::before,.atlas .roadline::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--terra);transform:translateY(-50%)}
.atlas .roadline::before{left:-4px}.atlas .roadline::after{right:-4px;background:var(--green)}
.legs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.leg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative}

.leg::before{content:"";position:absolute;top:-24px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--bronze);transform:translateX(-50%);border:2px solid var(--paper)}
.leg .km{font-family:Fraunces,serif;font-size:26px;font-weight:800;color:var(--terra)}
.leg .km small{font-size:13px;color:var(--muted);font-family:Inter,sans-serif;font-weight:700}
.leg h3{font-size:15.5px;margin:2px 0 2px}
.leg p{font-size:13px;color:var(--ink2)}
.leg .mins{margin-top:8px}
.routetot{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.routetot .stat{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.routetot .stat b{font-family:Fraunces,serif;font-size:22px;display:block}
.routetot .stat span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
/* ---------- stops ---------- */
.stops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stop{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;align-items:flex-start}
.stop .pin{flex:none;width:44px;text-align:center}
.stop .pin b{display:block;font-family:Fraunces,serif;font-size:19px;color:var(--terra)}
.stop .pin span{font-size:11px;color:var(--muted);font-weight:700}
.stop h3{font-size:16px}
.stop p{font-size:13.5px;color:var(--ink2)}
.stop .tag{margin-top:6px}
/* ---------- calculator ---------- */
.calc{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:stretch}
.calc .panel{padding:20px 22px}
.field{margin-bottom:14px}
.field label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field label output{color:var(--terra);font-weight:800}
.field input[type=range]{width:100%;accent-color:var(--terra)}
.field input[type=number],.field select,.field input[type=text],.field input[type=date]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-weight:700;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.receipt{font-size:14.5px}
.receipt .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}
.receipt .row.total{border-bottom:0;font-weight:800;font-size:17px}
.receipt .row.total b{font-family:Fraunces,serif;font-size:22px;color:var(--terra)}
.receipt .row.pp{background:#fbf3df;border-radius:10px;padding:10px 12px;border:0;margin-top:8px}
/* ---------- budget ---------- */
.budget{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:stretch}
.ringwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}

.ringwrap svg{width:150px;height:150px}
.ringwrap .pct{font-family:Fraunces,serif;font-size:30px;font-weight:800}
.brows .brow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.brows .brow:last-child{border-bottom:0}
.brows .bar{height:7px;background:var(--paper2);border-radius:99px;margin-top:6px;overflow:hidden}
.brows .bar i{display:block;height:100%;background:var(--bronze);border-radius:99px}
.brows .bar i.over{background:var(--red)}
.spendform{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.spendform input,.spendform select{flex:1;min-width:120px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
/* ---------- checklists ---------- */
.split2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.checkcard{padding:20px 22px}
.checkhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.checkhead h3{font-size:19px}
.ringmini{display:flex;align-items:center;gap:10px}
.ringmini svg{width:52px;height:52px}
.ringmini b{font-family:Fraunces,serif;font-size:19px}
.checklist{list-style:none;margin-top:8px}
.checklist li{display:flex;gap:11px;align-items:flex-start;padding:10px 2px;border-bottom:1px dashed var(--line);cursor:pointer;font-size:14.5px}
.checklist li:last-child{border-bottom:0}
.checklist .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--bronze);margin-top:1px;display:grid;place-items:center;color:#fff;background:#fff}
.checklist .box svg{width:14px;height:14px;opacity:0}
.checklist li.done .box{background:var(--green);border-color:var(--green)}
.checklist li.done .box svg{opacity:1}
.checklist li.done span{color:var(--muted);text-decoration:line-through}
.checklist li .why{display:block;font-size:12.5px;color:var(--muted)}
/* ---------- day plan ---------- */
.plandays{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.planday{padding:18px}
.planday .dayno{font-family:Fraunces,serif;font-size:15px;font-weight:800;color:var(--terra)}
.planday h3{font-size:18px;margin:2px 0 8px}
.planday ul{list-style:none}
.planday li{font-size:14px;padding:7px 0 7px 22px;position:relative;border-bottom:1px dashed var(--line)}
.planday li:last-child{border-bottom:0}
.planday li::before{content:"";position:absolute;left:2px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--bronze)}
/* ---------- guides ---------- */
.guides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.guide{padding:18px 20px}
.guide summary{cursor:pointer;font-family:Fraunces,serif;font-size:18px;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide summary .chev{transition:transform .2s;color:var(--bronze)}
